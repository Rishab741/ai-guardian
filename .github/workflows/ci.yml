name: CI

# Build/import checks only — actual deploys are handled by Vercel's and
# Render's own GitHub integrations (see DEPLOYMENT.md), not this workflow.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  api-import-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import every module (catches syntax/import errors in both demo and production code paths)
        run: |
          python -c "import main"
        env:
          DEMO_MODE: "true"
