name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sf_dev_password
          POSTGRES_DB: sovereignfabric_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sf" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
